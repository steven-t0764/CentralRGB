name: Build Central RGB

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Central RGB.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --uac-admin
          --collect-all customtkinter --collect-all pythonnet --collect-all clr_loader --hidden-import clr
          --hidden-import PIL._tkinter_finder --icon central_rgb.ico
          --add-data "central_rgb.ico;." --add-data "central_rgb.png;."
          --name "Central RGB" central_rgb.py

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc central_rgb.iss

      - uses: actions/upload-artifact@v4
        with:
          name: CentralRGB-Windows
          path: |
            dist/Central RGB.exe
            installer/*.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/*.exe
            dist/Central RGB.exe
