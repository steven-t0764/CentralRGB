name: Build Central RGB

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # lets release builds attach the installer and exe

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Use the release tag as the version
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $v = "${{ github.event.release.tag_name }}".TrimStart("v")
          (Get-Content rgb_engine.py) -replace '^APP_VERSION = ".*?"', "APP_VERSION = `"$v`"" | Set-Content rgb_engine.py
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Building version $v"

      - name: Build Central RGB.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --uac-admin
          --collect-all customtkinter --collect-all pythonnet --collect-all clr_loader --hidden-import clr
          --hidden-import PIL._tkinter_finder --icon central_rgb.ico
          --add-data "central_rgb.ico;." --add-data "central_rgb.png;." --add-data "presets;presets"
          --name "Central RGB" central_rgb.py

      - name: Self-test (launch the app on this clean Windows machine)
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath "dist\Central RGB.exe" -ArgumentList "--selftest `"$report`"" -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw "Self-test timed out after 2 minutes" }
          Write-Host "Process ran for $($sw.ElapsedMilliseconds) ms (includes 9 s of measuring)"
          if (Test-Path $report) { Get-Content $report } else { Write-Host "No self-test report was written" }
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit code $($p.ExitCode))" }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if ($env:APP_VERSION) { & $iscc "/DAppVersion=$env:APP_VERSION" central_rgb.iss } else { & $iscc central_rgb.iss }

      - uses: actions/upload-artifact@v4
        with:
          name: CentralRGB-Windows
          path: |
            dist/Central RGB.exe
            installer/*.exe

      - name: Attach files to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/*.exe
            dist/Central RGB.exe
