name: Build Central RGB

on:
  push:
    branches: [main, test]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # lets release builds attach the installer and exe

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Use the release tag as the version
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $v = "${{ github.event.release.tag_name }}".TrimStart("v")
          (Get-Content rgb_engine.py) -replace '^APP_VERSION = ".*?"', "APP_VERSION = `"$v`"" | Set-Content rgb_engine.py
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Building version $v"

      # Two builds: a folder build for the installer (starts fast: nothing to unpack on each launch)
      # and a single portable exe (unpacks itself to a temp folder every time it starts).
      - name: Build Central RGB (installed folder build)
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed --uac-admin --distpath dist_app
          --collect-all customtkinter --collect-all pythonnet --collect-all clr_loader --hidden-import clr
          --hidden-import PIL._tkinter_finder --icon central_rgb.ico
          --add-data "central_rgb.ico;." --add-data "central_rgb.png;." --add-data "presets;presets"
          --name "Central RGB" central_rgb.py

      - name: Build Central RGB.exe (portable single file)
        run: >
          pyinstaller --noconfirm --onefile --windowed --uac-admin
          --collect-all customtkinter --collect-all pythonnet --collect-all clr_loader --hidden-import clr
          --hidden-import PIL._tkinter_finder --icon central_rgb.ico
          --add-data "central_rgb.ico;." --add-data "central_rgb.png;." --add-data "presets;presets"
          --name "Central RGB" central_rgb.py

      - name: Self-test (launch the app on this clean Windows machine)
        shell: pwsh
        run: |
          $env:CENTRALRGB_SHOTS = Join-Path $env:RUNNER_TEMP "shots"
          New-Item -ItemType Directory -Force -Path $env:CENTRALRGB_SHOTS | Out-Null
          foreach ($exe in @("dist_app\Central RGB\Central RGB.exe", "dist\Central RGB.exe")) {
            Write-Host "===== $exe ====="
            $report = Join-Path $env:RUNNER_TEMP ("selftest_" + [IO.Path]::GetRandomFileName() + ".txt")
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $exe -ArgumentList "--selftest `"$report`"" -PassThru
            if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw "Self-test timed out after 2 minutes" }
            Write-Host "Process ran for $($sw.ElapsedMilliseconds) ms (includes 9 s of measuring)"
            if (Test-Path $report) { Get-Content $report } else { Write-Host "No self-test report was written" }
            if ($p.ExitCode -ne 0) { throw "Self-test failed (exit code $($p.ExitCode))" }
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if ($env:APP_VERSION) { & $iscc "/DAppVersion=$env:APP_VERSION" central_rgb.iss } else { & $iscc central_rgb.iss }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-screenshots
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: CentralRGB-Windows
          path: |
            dist/Central RGB.exe
            installer/*.exe

      - name: Attach files to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/*.exe
            dist/Central RGB.exe

      # Pushes to the "test" branch publish a pre-release named test-build (not a real release), so a build
      # can be tried on a real PC first. Its files are replaced on every test push.
      - name: Publish test build
        if: github.event_name == 'push' && github.ref == 'refs/heads/test'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          gh release view test-build *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create test-build --prerelease --target "${{ github.sha }}" --title "Test build (not a release)" --notes "Automatic build from the test branch."
          }
          Copy-Item "dist\Central RGB.exe" "Central-RGB-test.exe"
          Copy-Item (Get-ChildItem installer\*.exe | Select-Object -First 1).FullName "CentralRGB-Setup-test.exe"
          gh release upload test-build "Central-RGB-test.exe" "CentralRGB-Setup-test.exe" --clobber
          gh release edit test-build --notes "Automatic build of commit $sha from the test branch, for trying changes before a real release."
